version: '3.8'

services:
  nginx:
    build: .
    ports:
      - "80:80"
    volumes:
      - .nginx.conf:/etc/nginx/nginx.conf
      - ./html:/usr/share/nginx/html
    networks:
      - app_network

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/code
      - static_volume:/code/static
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      - POSTGRES_DB=${NAME}
      - POSTGRES_USER=${USER}
      - POSTGRES_PASSWORD=${PASSWORD}
    networks:
      - app_network

  db:
    image: postgres:16.0
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${NAME}
      - POSTGRES_USER=${USER}
      - POSTGRES_PASSWORD=${PASSWORD}
    ports:
      - "${PORT}:5432"
    networks:
      - app_network

  django:
    build:
      context: .
      dockerfile: docker/django/Dockerfile
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./Gud_habit:/app
      - static_volume:/static
    networks:
      - app_network
    ports:
      - "8080:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=Personal_diary.settings
    env_file:
      - .env
    depends_on:
      - db

networks:
  app_network:
    driver: bridge

volumes:
  postgres_data:
  static_volume:
