{% extends 'users/includes/base.html' %}
{% load static %}
{% load i18n %}


{% block content %}
<h1>Введите новый пароль</h1>
<form method="post">
    {% csrf_token %}
    {{ form.new_password1.errors }}
    <p><label for="id_new_password1">Новый пароль:</label> {{ form.new_password1 }}</p>

    {{ form.new_password2.errors }}
    <p><label for="id_new_password2">Подтверждение:</label> {{ form.new_password2 }}</p>
    <button type="submit">Сохранить</button>
</form>
{% endblock %}
