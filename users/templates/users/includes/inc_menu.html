<nav class="navbar navbar-expand-md bg-dark sticky-top border-bottom" data-bs-theme="dark">
    <div class="container"><a class="navbar-brand d-md-none" href="#">

            <use xlink:href="#aperture"></use>
        </svg>
        <ya-tr-span data-index="1-0" data-translated="true" data-source-lang="en" data-target-lang="ru"

    </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvas"

        <div class="offcanvas offcanvas-end" tabindex="-1" id="offcanvas" aria-labelledby="offcanvasLabel">

            </div>
            <div class="offcanvas-body">
                <ul class="navbar-nav flex-grow-1 justify-content-between">
                    <li class="nav-item"><a class="nav-link" href="{% url 'entries:home' %}" aria-label="Отверстие">
                        <svg class="bi" width="24" height="24" aria-hidden="true">
                            <use xlink:href="#aperture"></use>
                        </svg>
                    </a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'entries:entries_create' %}">
                        <ya-tr-span data-index="2-0" data-translated="true" data-source-lang="en" data-target-lang="ru"
                                    data-value="Tour" data-translation="Тур" data-ch="0" data-type="trSpan"
                                    style="visibility: inherit !important;">Создать новую запись
                        </ya-tr-span>
                    </a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'users:profile' %}">
                        <ya-tr-span data-index="2-0" data-translated="true" data-source-lang="en" data-target-lang="ru"
                                    data-value="Product" data-translation="Профиль" data-ch="0" data-type="trSpan"
                                    style="visibility: inherit !important;">Профиль
                        </ya-tr-span>
                    </a></li>
                    {% if user.is_authenticated %}
                    <li class="nav-item">
                        <form method="post" action="{% url 'accounts:logout' %}">
                            {% csrf_token %}
                            <button type="submit" class="nav-link btn btn-link p-0 m-0"
                                    style="border: none; background: none;">
                                Выход
                            </button>
                        </form>
                    </li>
                    {% else %}
                    <li class="nav-item">
                        <form method="post" action="{% url 'accounts:login' %}">

                            <button type="submit" class="nav-link btn btn-link p-0 m-0"

                                Выход
                            </button>
                        </form>
                    </li>
