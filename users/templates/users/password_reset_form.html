{% extends 'users/includes/base.html' %}
{% load static %}
{% load i18n %}


{% block content %}
<h1>Сбросить пароль</h1>
<form method="post">
    {% csrf_token %}
    <p>
        <label for="id_email">Email:</label>
        <input type="email" name="email" id="id_email" required>
    </p>
    <button type="submit">Отправить</button>
</form>
{% endblock %}
